<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" fill="none">
  <defs>
    <linearGradient id="gisGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48E336" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="gisGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="gisPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48E336" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#48E336" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#48E336" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Graticule Coordinate Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="50" y1="100" x2="650" y2="100" />
    <line x1="50" y1="200" x2="650" y2="200" />
    <line x1="50" y1="300" x2="650" y2="300" />
    <line x1="50" y1="400" x2="650" y2="400" />
    <line x1="50" y1="500" x2="650" y2="500" />
    <line x1="50" y1="600" x2="650" y2="600" />

    <line x1="100" y1="50" x2="100" y2="650" />
    <line x1="200" y1="50" x2="200" y2="650" />
    <line x1="300" y1="50" x2="300" y2="650" />
    <line x1="400" y1="50" x2="400" y2="650" />
    <line x1="500" y1="50" x2="500" y2="650" />
    <line x1="600" y1="50" x2="600" y2="650" />
  </g>

  <!-- Coordinate Labels -->
  <g fill="#48E336" fill-opacity="0.75" font-family="monospace" font-size="10" letter-spacing="1">
    <text x="105" y="92">14°39'N</text>
    <text x="105" y="292">14°37'N</text>
    <text x="105" y="492">14°35'N</text>
    <text x="205" y="625">90°22'W</text>
    <text x="405" y="625">90°20'W</text>
    <text x="505" y="625">90°18'W</text>
    <text x="450" y="85">CRS: EPSG:4326 (WGS84)</text>
    <text x="450" y="105">SENSOR: SENTINEL-2 L2A</text>
    <text x="450" y="125">RES: 10m / NDVI-SCL</text>
  </g>

  <!-- Topographic Contour Curves (Isolines) -->
  <g fill="none" stroke="url(#gisGradGreen)" stroke-width="1.2" opacity="0.65">
    <path d="M 60,320 C 130,280 180,360 270,330 C 360,300 420,240 510,270 C 580,290 620,260 660,250" />
    <path d="M 50,380 C 140,340 200,430 300,390 C 400,350 460,290 540,320 C 600,340 640,310 670,300" />
    <path d="M 70,440 C 160,400 220,490 320,450 C 420,410 490,360 570,390 C 620,410 650,380 675,370" />
    <path d="M 80,260 C 150,220 210,300 290,270 C 370,240 430,190 520,210 C 580,225 620,200 650,190" />
    <path d="M 120,200 C 180,170 240,240 320,210 C 400,180 460,140 540,160 C 590,175 625,150 645,140" />
  </g>

  <!-- GIS Vector Polygons (Urban & Catchment Zones) -->
  <g fill="#48E336" fill-opacity="0.04" stroke="#48E336" stroke-width="1.4" stroke-opacity="0.8">
    <polygon points="280,180 430,150 510,240 470,360 360,400 240,320 220,230" />
    <polygon points="320,220 400,200 450,260 420,330 350,350 280,300 270,250" stroke-dasharray="5,3" fill="#38BDF8" fill-opacity="0.05" stroke="#38BDF8" />
  </g>

  <!-- GIS Nodes & Vertices -->
  <g fill="#48E336" stroke="#060D24" stroke-width="2">
    <circle cx="280" cy="180" r="4.5" />
    <circle cx="430" cy="150" r="4.5" />
    <circle cx="510" cy="240" r="4.5" />
    <circle cx="470" cy="360" r="4.5" />
    <circle cx="360" cy="400" r="4.5" />
    <circle cx="240" cy="320" r="4.5" />
    <circle cx="220" cy="230" r="4.5" />
    <!-- Secondary nodes -->
    <circle cx="320" cy="220" r="3.5" fill="#38BDF8" />
    <circle cx="400" cy="200" r="3.5" fill="#38BDF8" />
    <circle cx="450" cy="260" r="3.5" fill="#38BDF8" />
    <circle cx="420" cy="330" r="3.5" fill="#38BDF8" />
    <circle cx="350" cy="350" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Centroid Crosshair / Target (Lat 14°37', Lon 90°20') -->
  <g transform="translate(360, 275)">
    <circle cx="0" cy="0" r="48" fill="url(#gisPulse)" />
    <circle cx="0" cy="0" r="32" stroke="#48E336" stroke-width="1" stroke-opacity="0.7" stroke-dasharray="4,2" />
    <circle cx="0" cy="0" r="16" stroke="#48E336" stroke-width="1.2" stroke-opacity="0.9" />
    <circle cx="0" cy="0" r="3" fill="#48E336" />
    <line x1="-40" y1="0" x2="-8" y2="0" stroke="#48E336" stroke-width="1.2" />
    <line x1="8" y1="0" x2="40" y2="0" stroke="#48E336" stroke-width="1.2" />
    <line x1="0" y1="-40" x2="0" y2="-8" stroke="#48E336" stroke-width="1.2" />
    <line x1="0" y1="8" x2="0" y2="40" stroke="#48E336" stroke-width="1.2" />
  </g>

  <!-- Satellite Swath / Sensor Beam -->
  <g stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.4" stroke-dasharray="6,4">
    <line x1="120" y1="80" x2="280" y2="520" />
    <line x1="220" y1="60" x2="380" y2="500" />
    <line x1="170" y1="70" x2="330" y2="510" stroke="#48E336" stroke-opacity="0.5" />
  </g>

  <!-- Minimalist North Compass -->
  <g transform="translate(90, 560)">
    <circle cx="0" cy="0" r="24" stroke="#48E336" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#48E336" />
    <polygon points="0,18 5,0 0,4 -5,0" fill="#38BDF8" fill-opacity="0.6" />
    <text x="-4" y="-22" fill="#48E336" font-family="sans-serif" font-weight="bold" font-size="11">N</text>
  </g>

  <!-- Hexagonal Spatial Index (H3 / Discrete Global Grid) -->
  <g stroke="#48E336" stroke-opacity="0.25" stroke-width="0.8" fill="none">
    <polygon points="480,440 500,430 520,440 520,460 500,470 480,460" />
    <polygon points="520,440 540,430 560,440 560,460 540,470 520,460" />
    <polygon points="500,470 520,460 540,470 540,490 520,500 500,490" />
    <polygon points="460,470 480,460 500,470 500,490 480,500 460,490" />
  </g>
</svg>
